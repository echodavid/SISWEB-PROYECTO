<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Nuevo reporte</title>
</h:head>
<h:body>
    <h:form id="formReporte">
        <p:messages id="messages" showDetail="true" closable="true" />

        <p:panel header="Registrar nuevo reporte ciudadano" style="max-width: 900px; margin: 20px auto;">
            <p:panelGrid columns="2" columnClasses="label,value" cellpadding="6">
                <p:outputLabel for="titulo" value="Título" />
                <p:inputText id="titulo" value="#{reporteBean.reporte.titulo}" required="true" requiredMessage="El título es obligatorio." style="width: 100%;" />

                <p:outputLabel for="descripcion" value="Descripción" />
                <p:inputTextarea id="descripcion" value="#{reporteBean.reporte.descripcion}" required="true" requiredMessage="La descripción es obligatoria." rows="5" style="width: 100%;" />

                <p:outputLabel for="ubicacion" value="Ubicación" />
                <p:inputText id="ubicacion" value="#{reporteBean.reporte.ubicacion}" required="true" requiredMessage="La ubicación es obligatoria." style="width: 100%;" />

                <p:outputLabel for="prioridad" value="Prioridad" />
                <p:selectOneMenu id="prioridad" value="#{reporteBean.reporte.prioridad}">
                    <f:selectItem itemLabel="Seleccione" itemValue="" />
                    <f:selectItem itemLabel="Baja" itemValue="BAJA" />
                    <f:selectItem itemLabel="Media" itemValue="MEDIA" />
                    <f:selectItem itemLabel="Alta" itemValue="ALTA" />
                </p:selectOneMenu>
            </p:panelGrid>

            <f:facet name="footer">
                <p:commandButton value="Guardar reporte" actionListener="#{reporteBean.guardar}" update="messages formReporte" ajax="false" />
                <p:button value="Cancelar" outcome="/reportes" style="margin-left: 10px;" />
            </f:facet>
        </p:panel>
    </h:form>
</h:body>
</html>
