<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Nuevo reporte</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 750px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .panel-reporte {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            border-radius: 8px;
        }

        .formulario {
            width: 100%;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .input-completo {
            width: 100%;
            box-sizing: border-box;
        }

        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</h:head>

<h:body>

    <div class="contenedor">

        <h:form id="formReporte">

            <p:messages id="messages"
                        showDetail="true"
                        closable="true" />

            <p:panel header="Registrar nuevo reporte ciudadano"
                     styleClass="panel-reporte">

                <p:outputPanel styleClass="formulario">

                    <!-- TÍTULO -->
                    <div class="campo">

                        <p:outputLabel for="titulo"
                                       value="Título" />

                        <p:inputText id="titulo"
                                     value="#{reporteBean.reporte.titulo}"
                                     required="true"
                                     requiredMessage="El título es obligatorio."
                                     placeholder="Título del reporte"
                                     styleClass="input-completo" />

                    </div>


                    <!-- DESCRIPCIÓN -->
                    <div class="campo">

                        <p:outputLabel for="descripcion"
                                       value="Descripción" />

                        <p:inputTextarea id="descripcion"
                                         value="#{reporteBean.reporte.descripcion}"
                                         required="true"
                                         requiredMessage="La descripción es obligatoria."
                                         rows="5"
                                         autoResize="false"
                                         placeholder="Describe el problema"
                                         styleClass="input-completo" />

                    </div>


                    <!-- UBICACIÓN -->
                    <div class="campo">

                        <p:outputLabel for="ubicacion"
                                       value="Ubicación" />

                        <p:inputText id="ubicacion"
                                     value="#{reporteBean.reporte.ubicacion}"
                                     required="true"
                                     requiredMessage="La ubicación es obligatoria."
                                     placeholder="Ubicación del reporte"
                                     styleClass="input-completo" />

                    </div>


                    <!-- PRIORIDAD -->
                    <div class="campo">

                        <p:outputLabel for="prioridad"
                                       value="Prioridad" />

                        <p:selectOneMenu id="prioridad"
                                         value="#{reporteBean.reporte.prioridad}"
                                         style="width: 100%;">

                            <f:selectItem itemLabel="Seleccione"
                                          itemValue="" />

                            <f:selectItem itemLabel="Baja"
                                          itemValue="BAJA" />

                            <f:selectItem itemLabel="Media"
                                          itemValue="MEDIA" />

                            <f:selectItem itemLabel="Alta"
                                          itemValue="ALTA" />

                        </p:selectOneMenu>

                    </div>

                </p:outputPanel>


                <p:separator />


                <!-- BOTONES -->
                <div class="acciones">

                    <p:button value="Cancelar"
                              outcome="/reportes"
                              styleClass="ui-button-secondary" />

                    <p:commandButton value="Guardar reporte"
                                     actionListener="#{reporteBean.guardar}"
                                     ajax="false" />

                </div>

            </p:panel>

        </h:form>

    </div>

</h:body>
</html>
