<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Reportes</title>
</h:head>
<h:body>
    <h:form>
        <p:messages id="messages" globalOnly="true" showDetail="true" closable="true" />

        <p:toolbar>
            <p:toolbarGroup>
                <p:button value="Inicio" outcome="/index" />
                <p:button value="Nuevo reporte" outcome="/nuevo-reporte" />
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable value="#{reporteBean.reportes}" var="reporte" paginator="true" rows="10" style="margin-top: 20px;">
            <p:column headerText="ID">
                <h:outputText value="#{reporte.id}" />
            </p:column>
            <p:column headerText="Título">
                <h:outputText value="#{reporte.titulo}" />
            </p:column>
            <p:column headerText="Descripción">
                <h:outputText value="#{reporte.descripcion}" />
            </p:column>
            <p:column headerText="Ubicación">
                <h:outputText value="#{reporte.ubicacion}" />
            </p:column>
            <p:column headerText="Prioridad">
                <h:outputText value="#{reporte.prioridad}" />
            </p:column>
            <p:column headerText="Estado">
                <h:outputText value="#{reporte.estadoId}" />
            </p:column>
        </p:dataTable>
    </h:form>
</h:body>
</html>
