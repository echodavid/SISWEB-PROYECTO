services:
  postgres:
    image: postgres:16-alpine
    container_name: pr07-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pr07_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pr07_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr07_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pr07_pgdata:
